<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Detail Produk - Dapur Sultan</title>
  <meta name="description" id="page-desc" content="Detail menu katering premium Dapur Sultan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="detail-produk.css" />
</head>
<body>
  <div class="page-wrapper">

    <!-- Sticky Top Bar -->
    <div class="dp-topbar" id="dp-topbar">
      <button class="dp-back-btn" onclick="history.back()" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      </button>
      <span class="dp-topbar-title" id="dp-topbar-title">Detail Produk</span>
      <div class="dp-topbar-actions">
        <a href="keranjang.html" class="dp-cart-btn" aria-label="Keranjang">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
        <button class="dp-share-btn" onclick="shareProduct()" aria-label="Bagikan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div class="dp-content-container">

      <!-- Gallery Section (Full View, clean square aspect-ratio, not cut off) -->
      <div class="dp-gallery-section">
        <div class="dp-main-image-wrap">
          <img id="dp-main-img" src="img/ayam_Goreng.webp" alt="Foto Produk" />
          <span class="dp-discount-badge" id="dp-discount" style="display:none"></span>
        </div>

        <!-- Thumbnail Selector Row (underneath main photo like Gambar 2) -->
        <div class="dp-thumbnails-row" id="dp-thumbnails-row">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Product Info Card -->
      <div class="dp-info-card">

        <!-- Breadcrumb -->
        <nav class="dp-breadcrumb">
          <a href="index.html">Beranda</a>
          <span>›</span>
          <a href="daftar-menu.html">Menu</a>
          <span>›</span>
          <a href="#" id="dp-cat-link" class="dp-cat-link"></a>
          <span>›</span>
          <span id="dp-bc-name">...</span>
        </nav>

        <!-- Tags Row -->
        <div class="dp-tags-row" id="dp-tags-row"></div>

        <!-- Product Name & Subtitle -->
        <h1 class="dp-name" id="dp-name">Memuat...</h1>
        <p class="dp-short-desc" id="dp-short-desc"></p>

        <!-- Rating Row -->
        <div class="dp-rating-row">
          <div class="dp-stars" id="dp-stars"></div>
          <span class="dp-rating-num" id="dp-rating-num"></span>
          <span class="dp-review-count" id="dp-review-count"></span>
          <span class="dp-sep">|</span>
          <span class="dp-min-order" id="dp-min-order">Min. 10 porsi</span>
        </div>

        <!-- Price Row -->
        <div class="dp-price-row">
          <span class="dp-price" id="dp-price"></span>
          <span class="dp-price-ori" id="dp-price-ori" style="display:none"></span>
          <span class="dp-savings" id="dp-savings" style="display:none"></span>
        </div>

        <!-- Delivery & Trust Info -->
        <div class="dp-delivery-row">
          <div class="dp-delivery-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>Halal &amp; Higienis</span>
          </div>
          <div class="dp-delivery-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span>Antar ke Lokasi</span>
          </div>
        </div>

        <div class="dp-divider"></div>

        <!-- Description -->
        <div class="dp-section">
          <h2 class="dp-section-title">Cerita di Balik Rasa & Deskripsi</h2>
          <p class="dp-desc" id="dp-desc"></p>
        </div>

        <!-- Isi Paket -->
        <div class="dp-section" id="dp-isi-section">
          <h2 class="dp-section-title">Isi Paket</h2>
          <ul class="dp-isi-list" id="dp-isi-list"></ul>
        </div>

        <div class="dp-divider"></div>

        <!-- Quantity -->
        <div class="dp-qty-section">
          <div class="dp-qty-label">
            <span>Jumlah Pesan</span>
            <span class="dp-min-note" id="dp-min-note">Min. 10 porsi</span>
          </div>
          <div class="dp-qty-ctrl">
            <button class="dp-qty-btn" id="dp-qty-minus" onclick="changeQty(-1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <input type="number" class="dp-qty-input" id="dp-qty-input" value="10" min="1" onchange="syncQtyInput()" />
            <button class="dp-qty-btn" id="dp-qty-plus" onclick="changeQty(1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>

        <!-- Total Price -->
        <div class="dp-total-row">
          <span>Total Estimasi</span>
          <span class="dp-total-price" id="dp-total-price">Rp 350.000</span>
        </div>

        <div class="dp-divider"></div>

        <!-- Related Products -->
        <div class="dp-section">
          <h2 class="dp-section-title">Menu Pilihan Lainnya</h2>
          <div class="dp-related-scroll" id="dp-related"></div>
        </div>

        <!-- Spacer for fixed CTA -->
        <div style="height: 85px;"></div>
      </div>
    </div>

    <!-- Fixed Bottom CTA Bar -->
    <div class="dp-cta-bar">
      <button class="dp-btn-keranjang" id="dp-btn-keranjang" onclick="addToCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Tambah ke Keranjang
      </button>
      <button class="dp-btn-beli" id="dp-btn-beli" onclick="beliSekarang()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Pesan Langsung
      </button>
    </div>

    <!-- Toast -->
    <div class="dp-toast" id="dp-toast"></div>

  </div>

  <script src="menu-data.js"></script>
  <script src="detail-produk.js"></script>
</body>
</html>
